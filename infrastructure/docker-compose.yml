# NEXORA — environnement de développement local
#   docker compose -f infrastructure/docker-compose.yml up -d postgres
#   PGPASSWORD=nexora PGUSER=nexora database/scripts/rebuild.sh nexora
#   docker compose -f infrastructure/docker-compose.yml up -d api

services:
  postgres:
    image: postgres:18
    container_name: nexora-postgres
    environment:
      POSTGRES_USER: nexora
      POSTGRES_PASSWORD: nexora
      POSTGRES_DB: nexora
      TZ: America/Port-au-Prince
    ports:
      - "5432:5432"
    volumes:
      # postgres:18 range ses données sous /var/lib/postgresql/18/… : on monte le parent, comme la production
      # (audit 2026-10 éd. 2 — le montage sur …/data ne correspondait plus à l'image).
      - nexora-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexora -d nexora"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..                    # racine du dépôt : migrations embarquées (§20)
      dockerfile: backend/Dockerfile
    container_name: nexora-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Runtime : rôle à privilèges minimaux, sans BYPASSRLS (§14)
      # Secrets obligatoires en Production : l'API refuse de démarrer sans eux (StartupSecretsGuard, §18).
      Database__ConnectionString: "Host=postgres;Port=5432;Database=nexora;Username=nexora_app;Password=${NEXORA_APP_DB_PASSWORD:?definir NEXORA_APP_DB_PASSWORD};Search Path=nexora,public"
      Jwt__SigningKey: "${NEXORA_JWT_SIGNING_KEY:?definir NEXORA_JWT_SIGNING_KEY (32 caracteres minimum)}"
      Security__MfaEncryptionKey: "${NEXORA_MFA_ENCRYPTION_KEY:?definir NEXORA_MFA_ENCRYPTION_KEY (base64 de 32 octets)}"
      # Clé des données personnelles (paie, banque), distincte de la clé MFA, comme en production.
      Security__DataEncryptionKey: "${NEXORA_DATA_ENCRYPTION_KEY:?definir NEXORA_DATA_ENCRYPTION_KEY (base64 de 32 octets, differente de la cle MFA)}"
      Cors__Origins__0: "http://localhost:5173"
    ports:
      - "5080:8080"
    profiles: ["api"]

volumes:
  nexora-pgdata:
