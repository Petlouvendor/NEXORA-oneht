# NEXORA ONE — Prometheus (finalisation phase 18) : métriques de l'API via le collecteur OpenTelemetry.
global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: otel-collector
    # Garder les étiquettes de l'application (job="nexora-api", instance…) au lieu de celles du collecteur :
    # les règles d'alerte filtrent sur job="nexora-api".
    honor_labels: true
    static_configs:
      - targets: ["otel-collector:8889"]

  # Indicateurs métier calculés par l'API elle-même (Phase 37, /api/v1/metrics) — réseau interne seulement.
  - job_name: nexora-api-metier
    metrics_path: /api/v1/metrics
    static_configs:
      - targets: ["api:8080"]
