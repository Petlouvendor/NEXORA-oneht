name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  # --- Base de données : validation des migrations (Phase 3 §27, §28) ---
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nexora
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Appliquer les migrations
        run: |
          cd database/scripts
          PSQL_BIN=psql PGHOST=localhost PGUSER=postgres bash apply.sh nexora
      - name: Test fonctionnel du modèle
        run: psql -h localhost -U postgres -d nexora -v ON_ERROR_STOP=1 -f database/scripts/smoke_test.sql

  # --- Backend : build, analyse, tests ---
  backend:
    runs-on: ubuntu-latest
    needs: database
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nexora
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: postgres
      NEXORA_IT_ADMIN: "Host=localhost;Port=5432;Username=postgres;Password=postgres;Database=postgres"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Base de test (migrations + démo)
        run: |
          cd database/scripts
          PSQL_BIN=psql PGHOST=localhost PGUSER=postgres bash apply.sh nexora
          psql -h localhost -U postgres -d nexora -v ON_ERROR_STOP=1 -f ../seeds/demo_abc_group.sql
          psql -h localhost -U postgres -d nexora -c "ALTER ROLE nexora_app WITH PASSWORD 'nexora_app_dev';"
      - name: Restore
        run: dotnet restore backend/Nexora.sln
      - name: Build (warnings = errors)
        run: dotnet build backend/Nexora.sln -c Release --no-restore
      - name: Tests (unitaires + API + intégration)
        run: dotnet test backend/Nexora.sln -c Release --no-build
      # Finalisation phase 18 : les migrations embarquées dans l'API sont exactement celles du dépôt, et la commande
      # « migrate » de l'image (sans psql) les reconnaît comme appliquées — code 0, sinon 2 (en attente) ou 3 (écart).
      - name: Migrations embarquées conformes (migrate --status)
        env:
          ASPNETCORE_ENVIRONMENT: Development
          Database__ConnectionString: "Host=localhost;Port=5432;Database=nexora;Username=postgres;Password=postgres"
        run: dotnet backend/src/Nexora.Api/bin/Release/net10.0/Nexora.Api.dll migrate --status
      - name: Scan de vulnérabilités des dépendances (§28)
        run: dotnet list backend/Nexora.sln package --vulnerable --include-transitive

  # --- Frontend : build & typecheck ---
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/nexora-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/nexora-web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # --- Images de production (finalisation phase 18 §39) : construction, configuration, règles d'alerte ---
  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Configuration de production valide
        run: |
          mkdir -p infrastructure/secrets
          for f in postgres_password migration_connection app_role_password app_connection jwt_signing_key                    mfa_encryption_key data_encryption_key backup_api_key smtp_password; do : > infrastructure/secrets/$f; done
          docker compose -f infrastructure/docker-compose.prod.yml --env-file infrastructure/production.env.example             --profile observability config --quiet
      - name: Règles d'alerte valides
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/infrastructure/observability:/r" prom/prometheus:v3.6.0             check rules /r/alerts.yml
      - name: Images API, interface, sauvegarde
        run: |
          docker build -f backend/Dockerfile --build-arg NEXORA_VERSION=0.0.0-ci --build-arg NEXORA_COMMIT=$GITHUB_SHA -t nexora-api:ci .
          docker build -f frontend/nexora-web/Dockerfile -t nexora-web:ci .
          docker build -f infrastructure/backup/Dockerfile -t nexora-backup:ci .
      - name: L'image API démarre et répond à sa sonde
        run: |
          docker run -d --name api-ci -e ASPNETCORE_ENVIRONMENT=Production nexora-api:ci
          for i in $(seq 1 30); do docker exec api-ci dotnet Nexora.Api.dll healthcheck && break; sleep 2; done
          docker exec api-ci dotnet Nexora.Api.dll healthcheck
