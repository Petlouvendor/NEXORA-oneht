name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  # --- Base de données : validation des migrations (Phase 3 §27, §28) ---
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nexora
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Appliquer les migrations
        run: |
          cd database/scripts
          PSQL_BIN=psql PGHOST=localhost PGUSER=postgres bash apply.sh nexora
      - name: Test fonctionnel du modèle
        run: psql -h localhost -U postgres -d nexora -v ON_ERROR_STOP=1 -f database/scripts/smoke_test.sql

  # --- Backend : build, analyse, tests ---
  backend:
    runs-on: ubuntu-latest
    needs: database
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nexora
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: postgres
      NEXORA_IT_ADMIN: "Host=localhost;Port=5432;Username=postgres;Password=postgres;Database=postgres"
      # Tests d'API sur leur propre base, jamais sur « nexora », modèle cloné par les tests d'intégration
      # (audit 2026-10 éd. 2, constat CI).
      NEXORA_API_TEST_DB: nexora_api_it
      NEXORA_IT_ADMIN_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Base de test (migrations + démo)
        run: |
          cd database/scripts
          PSQL_BIN=psql PGHOST=localhost PGUSER=postgres bash apply.sh nexora
          psql -h localhost -U postgres -d nexora -v ON_ERROR_STOP=1 -f ../seeds/demo_abc_group.sql
          psql -h localhost -U postgres -d nexora -c "ALTER ROLE nexora_app WITH PASSWORD 'nexora_app_dev';"
          psql -h localhost -U postgres -d postgres -c "CREATE DATABASE nexora_api_it TEMPLATE nexora;"
      - name: Restore
        run: dotnet restore backend/Nexora.sln
      - name: Build (warnings = errors)
        run: dotnet build backend/Nexora.sln -c Release --no-restore
      - name: Tests (unitaires + API + intégration)
        run: dotnet test backend/Nexora.sln -c Release --no-build
      # Finalisation phase 18 : les migrations embarquées dans l'API sont exactement celles du dépôt, et la commande
      # « migrate » de l'image (sans psql) les reconnaît comme appliquées — code 0, sinon 2 (en attente) ou 3 (écart).
      - name: Migrations embarquées conformes (migrate --status)
        env:
          ASPNETCORE_ENVIRONMENT: Development
          Database__ConnectionString: "Host=localhost;Port=5432;Database=nexora;Username=postgres;Password=postgres"
        run: dotnet backend/src/Nexora.Api/bin/Release/net10.0/Nexora.Api.dll migrate --status
      - name: Scan de vulnérabilités des dépendances (§28)
        # Bloquant (audit 2026-10, A-028) : la commande rend 0 même quand elle liste des paquets vulnérables.
        run: |
          out=$(dotnet list backend/Nexora.sln package --vulnerable --include-transitive)
          echo "$out"
          if echo "$out" | grep -q "has the following vulnerable packages"; then
            echo "::error::Dépendance vulnérable détectée"; exit 1
          fi

  # --- Frontend : build & typecheck ---
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/nexora-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/nexora-web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # --- Images de production (finalisation phase 18 §39) : construction, configuration, règles d'alerte ---
  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Configuration de production valide
        run: |
          mkdir -p infrastructure/secrets
          for f in postgres_password migration_connection app_role_password app_connection jwt_signing_key                    mfa_encryption_key data_encryption_key backup_api_key smtp_password; do : > infrastructure/secrets/$f; done
          docker compose -f infrastructure/docker-compose.prod.yml --env-file infrastructure/production.env.example             --profile observability config --quiet
      - name: Règles d'alerte valides
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/infrastructure/observability:/r" prom/prometheus:v3.6.0             check rules /r/alerts.yml
      - name: Images API, interface, sauvegarde
        run: |
          docker build -f backend/Dockerfile --build-arg NEXORA_VERSION=0.0.0-ci --build-arg NEXORA_COMMIT=$GITHUB_SHA -t nexora-api:ci .
          docker build -f frontend/nexora-web/Dockerfile -t nexora-web:ci .
          docker build -f infrastructure/backup/Dockerfile -t nexora-backup:ci .
      - name: L'image API démarre et répond à sa sonde
        run: |
          docker run -d --name api-ci -e ASPNETCORE_ENVIRONMENT=Production nexora-api:ci
          for i in $(seq 1 30); do docker exec api-ci dotnet Nexora.Api.dll healthcheck && break; sleep 2; done
          docker exec api-ci dotnet Nexora.Api.dll healthcheck

  # --- E2E global (finalisation phase 19, plan maître §41-43) : installation neuve, scénarios métier complets ---
  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      E: docker compose -p nexora-e2e -f infrastructure/docker-compose.prod.yml -f infrastructure/docker-compose.e2e.yml --env-file infrastructure/production.env
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/nexora-web/package-lock.json
      - name: Installation neuve (images construites depuis ce commit)
        run: |
          bash infrastructure/scripts/generate-secrets.sh
          cp infrastructure/production.env.example infrastructure/production.env
          sed -i -e 's/^NEXORA_DOMAIN=.*/NEXORA_DOMAIN=localhost/' -e 's/^NEXORA_REGISTRY=.*/NEXORA_REGISTRY=nexora/' \
                 -e 's/^NEXORA_OTLP_ENDPOINT=.*/NEXORA_OTLP_ENDPOINT=/' -e 's|^NEXORA_BACKUP_HOST_DIR=.*|NEXORA_BACKUP_HOST_DIR=./backups|' \
                 infrastructure/production.env
          $E up -d --build --wait api web
          $E run --rm -e 'Bootstrap__AdminPassword=E2e!Nexora2026' migrate bootstrap --company "Supermarché E2E" \
            --activity supermarket --currency HTG --admin-name "Direction E2E" --admin-email direction@e2e.ht
      - name: Scénarios E2E (Playwright)
        working-directory: frontend/nexora-web
        env:
          E2E_BASE_URL: http://localhost:8090
          E2E_ARTIFACTS: ${{ runner.temp }}/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Rapport et journaux en cas d'échec
        if: failure()
        run: $E logs api > ${{ runner.temp }}/e2e/api.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-report
          path: ${{ runner.temp }}/e2e
